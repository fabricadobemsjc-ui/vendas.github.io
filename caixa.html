<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar - Livro Caixa</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .top-bar h1 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .main-container {
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .btn-import {
            background-color: #3b82f6;
            color: white;
        }
        .btn-import:hover {
            background-color: #2563eb;
        }
        .livro-caixa {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .livro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .livro-header h2 {
            margin: 0;
        }
        .saldo-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .saldo-item {
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            min-width: 150px;
        }
        .saldo-item.anterior {
            background: #f1f5f9;
        }
        .saldo-item.entradas {
            background: rgba(34, 197, 94, 0.1);
        }
        .saldo-item.saidas {
            background: rgba(239, 68, 68, 0.1);
        }
        .saldo-item.final {
            background: rgba(99, 102, 241, 0.1);
        }
        .saldo-item span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .saldo-item strong {
            font-size: 1.3rem;
        }
        .saldo-item.entradas strong { color: var(--success-color); }
        .saldo-item.saidas strong { color: var(--danger-color); }
        .saldo-item.final strong { color: var(--primary-color); }

        .lancamentos-table th, .lancamentos-table td {
            padding: 10px 15px;
        }
        .lancamento-entrada { color: var(--success-color); }
        .lancamento-saida { color: var(--danger-color); }

        .saldo-anterior-edit {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }
        .saldo-anterior-edit input {
            width: 150px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .file-input-hidden {
            display: none;
        }

        @media print {
            .top-bar, .btn, .saldo-anterior-edit, button {
                display: none !important;
            }
            .main-container {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>💰 Bazar - Livro Caixa</h1>
        <div class="top-bar-actions">
            <input type="file" id="csv-input" class="file-input-hidden" accept=".csv" onchange="Importar.csv(this)">
            <button class="btn btn-import" onclick="document.getElementById('csv-input').click()">📥 Importar CSV</button>
            <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir</button>
            <a href="vendas.html" class="btn btn-primary">🛍️ Ir para Vendas</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Seletor de Mês -->
        <div class="filters" style="margin-bottom: 20px;">
            <select id="filtro-mes" onchange="LivroCaixa.carregar()">
            </select>
        </div>

        <!-- Saldo Anterior -->
        <div class="saldo-anterior-edit">
            <label><strong>Saldo Anterior do Mês:</strong></label>
            <input type="number" id="saldo-anterior-input" step="0.01" value="0">
            <button class="btn btn-sm btn-primary" onclick="LivroCaixa.salvarSaldoAnterior()">Salvar</button>
        </div>

        <!-- Livro Caixa -->
        <div class="livro-caixa">
            <div class="livro-header">
                <h2 id="livro-titulo">Livro Caixa</h2>
                <div class="saldo-box">
                    <div class="saldo-item anterior">
                        <span>Saldo Anterior</span>
                        <strong id="valor-anterior">R$ 0,00</strong>
                    </div>
                    <div class="saldo-item entradas">
                        <span>Entradas</span>
                        <strong id="valor-entradas">R$ 0,00</strong>
                    </div>
                    <div class="saldo-item saidas">
                        <span>Saídas</span>
                        <strong id="valor-saidas">R$ 0,00</strong>
                    </div>
                    <div class="saldo-item final">
                        <span>Saldo Final</span>
                        <strong id="valor-final">R$ 0,00</strong>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table class="table lancamentos-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Entrada</th>
                            <th>Saída</th>
                            <th>Saldo</th>
                        </tr>
                    </thead>
                    <tbody id="lista-lancamentos">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Saídas/Despesas -->
        <div class="livro-caixa">
            <div class="livro-header">
                <h2>Registrar Saída</h2>
                <button class="btn btn-primary" onclick="Saidas.abrirModal()">+ Nova Saída</button>
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-saidas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" onclick="Modal.fechar()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-titulo">Título</h3>
                <button class="modal-close" onclick="Modal.fechar()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/saidas.js"></script>
    <script src="js/livro-caixa.js"></script>
    <script src="js/importar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            LivroCaixa.init();
        });
    </script>
</body>
</html>
