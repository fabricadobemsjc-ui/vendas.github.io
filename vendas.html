<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar - Vendas</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--text-color);
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .top-bar h1 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar-actions {
            display: flex;
            gap: 10px;
        }
        .main-container {
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .btn-export {
            background-color: #22c55e;
            color: white;
        }
        .btn-export:hover {
            background-color: #16a34a;
        }
        .nav-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🛍️ Bazar - Vendas</h1>
        <div class="top-bar-actions">
            <button class="btn btn-export" onclick="Exportar.csv()">📤 Exportar CSV</button>
            <a href="caixa.html" class="btn btn-secondary">💰 Ir para Caixa</a>
        </div>
    </div>

    <div class="main-container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="roupas">👕 Roupas</button>
            <button class="tab-btn" data-tab="artesanato">🎨 Artesanato</button>
            <button class="tab-btn" data-tab="contribuicoes">💝 Contribuições</button>
            <button class="tab-btn" data-tab="clientes">👥 Clientes</button>
        </div>

        <!-- Tab: Roupas -->
        <div id="tab-roupas" class="tab-content active">
            <header class="page-header">
                <h2>Vendas de Roupas</h2>
                <button class="btn btn-primary" onclick="Vendas.abrirModalRoupa()">+ Nova Venda</button>
            </header>
            <div class="filters">
                <input type="date" id="filtro-roupas-inicio" onchange="Vendas.filtrarRoupas()">
                <input type="date" id="filtro-roupas-fim" onchange="Vendas.filtrarRoupas()">
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Cliente</th>
                            <th>Itens</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-roupas"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Artesanato -->
        <div id="tab-artesanato" class="tab-content">
            <header class="page-header">
                <h2>Vendas de Artesanato</h2>
                <button class="btn btn-primary" onclick="Vendas.abrirModalArtesanato()">+ Nova Venda</button>
            </header>
            <div class="filters">
                <input type="date" id="filtro-artesanato-inicio" onchange="Vendas.filtrarArtesanato()">
                <input type="date" id="filtro-artesanato-fim" onchange="Vendas.filtrarArtesanato()">
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-artesanato"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Contribuições -->
        <div id="tab-contribuicoes" class="tab-content">
            <header class="page-header">
                <h2>Contribuições</h2>
                <button class="btn btn-primary" onclick="Contribuicoes.abrirModal()">+ Nova Contribuição</button>
            </header>
            <div class="filters">
                <input type="date" id="filtro-contrib-inicio" onchange="Contribuicoes.filtrar()">
                <input type="date" id="filtro-contrib-fim" onchange="Contribuicoes.filtrar()">
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Contribuinte</th>
                            <th>Valor</th>
                            <th>Observação</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-contribuicoes"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Clientes -->
        <div id="tab-clientes" class="tab-content">
            <header class="page-header">
                <h2>Clientes</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="ImportarClientes.abrirModal()">📥 Importar Excel</button>
                    <button class="btn btn-primary" onclick="Clientes.abrirModal()">+ Novo Cliente</button>
                </div>
            </header>
            <div class="search-bar">
                <input type="text" id="busca-cliente" placeholder="Buscar por nome, CPF ou telefone..." onkeyup="Clientes.buscar(this.value)">
            </div>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" onclick="Modal.fechar()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-titulo">Título</h3>
                <button class="modal-close" onclick="Modal.fechar()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/clientes.js"></script>
    <script src="js/vendas.js"></script>
    <script src="js/contribuicoes.js"></script>
    <script src="js/exportar.js"></script>
    <script src="js/importar-clientes.js"></script>
    <script>
        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            Clientes.init();
            Vendas.initVendas();
            Contribuicoes.init();
        });
    </script>
</body>
</html>
